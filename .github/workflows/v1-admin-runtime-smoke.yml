name: V1 Admin Dashboard Runtime Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  admin-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Locked dependency install
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start real Vite preview and run Chromium startup smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/admin-preview.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ -o /tmp/admin-home.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ -o /tmp/admin-home.html
          grep -q '<div id="root"></div>' /tmp/admin-home.html
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          const response = await page.goto('http://127.0.0.1:4174/', { waitUntil: 'networkidle' });
          await page.waitForURL('**/admin/login');
          const titleVisible = await page.getByText('Admin Login', { exact: true }).isVisible();
          const emailVisible = await page.getByLabel('Email').isVisible();
          const passwordVisible = await page.getByLabel('Password').isVisible();
          const loginVisible = await page.getByRole('button', { name: 'Login' }).isVisible();
          console.log('ENV04_HTTP_STATUS=' + response.status());
          console.log('ENV04_FINAL_URL=' + page.url());
          console.log('ENV04_ADMIN_LOGIN_VISIBLE=' + titleVisible);
          console.log('ENV04_EMAIL_VISIBLE=' + emailVisible);
          console.log('ENV04_PASSWORD_VISIBLE=' + passwordVisible);
          console.log('ENV04_LOGIN_BUTTON_VISIBLE=' + loginVisible);
          console.log('ENV04_PAGE_ERRORS=' + JSON.stringify(errors));
          if (response.status() !== 200 || !titleVisible || !emailVisible || !passwordVisible || !loginVisible || errors.length) process.exitCode = 1;
          else console.log('ENV04_RUNTIME_STARTUP_PASS=true');
          await browser.close();
          NODE
          echo '--- Preview log evidence ---'
          cat /tmp/admin-preview.log
