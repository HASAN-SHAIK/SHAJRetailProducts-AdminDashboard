name: V1 Admin Activity Logs Admin Filter Failure Recovery Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  activity-logs-admin-filter-failure-recovery-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          echo "EXACT_HEAD=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Locked dependency install
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Existing ENV-04 runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4303 --strictPort > /tmp/admin-env04-logs-admin-filter-failure-recovery.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4303/admin/login >/dev/null; then break; fi
            sleep 1
          done
          kill -0 "$pid"
          CYPRESS_ADMIN_BASE_URL=http://127.0.0.1:4303 npx cypress run --browser electron --spec cypress/e2e/runtime/env04-admin-startup.cy.js
      - name: Real Activity Logs Admin-filter failure recovery application runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4304 --strictPort > /tmp/admin-logs-admin-filter-failure-recovery.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4304/admin/logs >/dev/null; then break; fi
            sleep 1
          done
          kill -0 "$pid"
          set +e
          CYPRESS_ADMIN_BASE_URL=http://127.0.0.1:4304 npx cypress run --browser electron --spec cypress/e2e/runtime/activity-logs-admin-filter-failure-recovery-runtime.cy.js
          test_status=$?
          set -e
          kill -0 "$pid"
          status=$(curl -sS -o /tmp/admin-logs-admin-filter-failure-recovery-after.html -w '%{http_code}' http://127.0.0.1:4304/admin/logs)
          echo "ADMIN_ACTIVITY_LOGS_ADMIN_FILTER_FAILURE_RECOVERY_ROUTE_HTTP_STATUS=$status"
          test "$status" = '200'
          grep -q '<div id="root"></div>' /tmp/admin-logs-admin-filter-failure-recovery-after.html
          cat /tmp/admin-logs-admin-filter-failure-recovery.log
          exit "$test_status"
