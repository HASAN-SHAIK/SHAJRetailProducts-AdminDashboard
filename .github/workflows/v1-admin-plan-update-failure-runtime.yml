name: V1 Admin Plan Update Failure Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  plan-update-failure-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Locked dependency install
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Existing ENV-04 automated/runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4214 --strictPort > /tmp/admin-env04-plan-failure-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4214/admin/login >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4214/admin/login >/dev/null
          CYPRESS_ADMIN_BASE_URL=http://127.0.0.1:4214 npx cypress run --browser electron --spec cypress/e2e/runtime/env04-admin-startup.cy.js
      - name: Real plan update failure application runtime
        id: plan_runtime
        shell: bash
        run: |
          set -uo pipefail
          npm run preview -- --host 127.0.0.1 --port 4215 --strictPort > /tmp/admin-plan-update-failure-preview.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4215/admin/plans >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4215/admin/plans >/dev/null || exit 1
          mkdir -p cypress/evidence
          CYPRESS_ADMIN_BASE_URL=http://127.0.0.1:4215 npx cypress run --browser electron --spec cypress/e2e/runtime/plan-update-failure-runtime.cy.js 2>&1 | tee cypress/evidence/plan-update-failure-cypress.log
          runtime_status=${PIPESTATUS[0]}
          kill -0 "$pid" || exit 1
          status=$(curl -sS -o /tmp/admin-plan-update-failure-route.html -w '%{http_code}' http://127.0.0.1:4215/admin/plans)
          test "$status" = "200" || exit 1
          grep -q '<div id="root"></div>' /tmp/admin-plan-update-failure-route.html || exit 1
          echo "ADMIN_PLAN_FAILURE_CYPRESS_EXIT=$runtime_status"
          echo 'ADMIN_PROCESS_ALIVE=true'
          echo "ADMIN_PLANS_ROUTE_HTTP_STATUS=$status"
          cat /tmp/admin-plan-update-failure-preview.log
          exit "$runtime_status"
      - name: Upload plan runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-a-plan-update-failure-evidence
          if-no-files-found: warn
          path: |
            cypress/evidence/plan-update-failure-cypress.log
            cypress/screenshots/**
            /tmp/admin-plan-update-failure-preview.log
            /tmp/admin-plan-update-failure-route.html
