name: V1 Admin Activity Logs Action Reset Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  activity-logs-action-reset-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Locked dependency install
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Existing ENV-04 automated/runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4275 --strictPort > /tmp/admin-env04-logs-action-reset-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4275/admin/login >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4275/admin/login >/dev/null
          CYPRESS_ADMIN_BASE_URL=http://127.0.0.1:4275 npx cypress run --browser electron --spec cypress/e2e/runtime/env04-admin-startup.cy.js
      - name: Real activity logs action reset application runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4276 --strictPort > /tmp/admin-logs-action-reset-preview.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4276/admin/logs >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4276/admin/logs >/dev/null
          CYPRESS_ADMIN_BASE_URL=http://127.0.0.1:4276 npx cypress run --browser electron --spec cypress/e2e/runtime/activity-logs-action-reset-runtime.cy.js
          kill -0 "$pid"
          status=$(curl -sS -o /tmp/admin-logs-action-reset-route.html -w '%{http_code}' http://127.0.0.1:4276/admin/logs)
          test "$status" = "200"
          grep -q '<div id="root"></div>' /tmp/admin-logs-action-reset-route.html
          echo 'ADMIN_ACTIVITY_LOGS_ACTION_RESET_RUNTIME_PASS=true'
          echo 'ADMIN_PROCESS_ALIVE=true'
          echo "ADMIN_LOGS_ROUTE_HTTP_STATUS=$status"
          cat /tmp/admin-logs-action-reset-preview.log
